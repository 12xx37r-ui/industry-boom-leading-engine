version: 1
model_input_role: sealed_holdout_taxonomy
minimum_exposure: 0.30
sealed_before_execution: true
notes:
  - V0.9.1 계산식은 변경하지 않고, 개발 코호트에 없던 산업을 독립 시점에서 평가합니다.
  - 노출도는 기업 전체 재무를 산업에 과대귀속하지 않도록 보수적으로 설정했습니다.
  - 30% 미만 노출 기업은 비교 설명에는 남길 수 있으나 점수 계산에서는 제외됩니다.
