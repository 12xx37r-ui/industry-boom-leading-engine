version: 1
benchmark_name: V1.0 locked AI benchmark replay - 2022
validation_role: locked_ai_replay_not_independent
investment_use_allowed: false
sealed_before_execution: true
model_version: 0.9.1
engine_release: 1.0.0
seed_file: validation_seed/sec_fsds_v1_ai_2022.json
exposure_file: config/v1_theme_exposures.yml
