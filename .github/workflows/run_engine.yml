name: Industry Boom Engine

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "현재 판정 기준일 (YYYY-MM-DD, 비우면 한국 날짜)"
        required: false
        type: string
      replay_as_of:
        description: "AI 과거 재현 기준일"
        required: true
        default: "2022-10-31"
        type: string
      use_sec:
        description: "SEC 선택 보강 (GitHub 러너 403 가능, 기본 끔)"
        required: true
        default: false
        type: boolean
      run_replay:
        description: "단일 AI 재현시험 실행 (전체 검증은 Industry Boom Validation 사용)"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: industry-boom-engine
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ible-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ible-cache-${{ runner.os }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Test
        run: pytest -q

      - name: Resolve inputs
        id: vars
        shell: bash
        run: |
          AS_OF="${{ inputs.as_of }}"
          if [ -z "$AS_OF" ]; then AS_OF="$(TZ=Asia/Seoul date +%F)"; fi
          REPLAY="${{ inputs.replay_as_of }}"
          if [ -z "$REPLAY" ]; then REPLAY="2022-10-31"; fi
          USE_SEC="${{ inputs.use_sec }}"
          if [ -z "$USE_SEC" ]; then USE_SEC="false"; fi
          RUN_REPLAY="${{ inputs.run_replay }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then RUN_REPLAY="false"; fi
          if [ -z "$RUN_REPLAY" ]; then RUN_REPLAY="false"; fi
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
          echo "replay=$REPLAY" >> "$GITHUB_OUTPUT"
          echo "use_sec=$USE_SEC" >> "$GITHUB_OUTPUT"
          echo "run_replay=$RUN_REPLAY" >> "$GITHUB_OUTPUT"

      - name: Run engine
        env:
          PYTHONUNBUFFERED: "1"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        shell: bash
        run: |
          if [ -z "$OPENDART_API_KEY" ]; then
            echo "MISSING_REQUIRED_CONFIGURATION: OPENDART_API_KEY"
            exit 1
          fi
          EXTRA=""
          if [ "${{ steps.vars.outputs.use_sec }}" = "true" ]; then EXTRA="$EXTRA --use-sec"; fi
          if [ "${{ steps.vars.outputs.run_replay }}" != "true" ]; then EXTRA="$EXTRA --skip-replay"; fi
          python -m ible.cli \
            --as-of "${{ steps.vars.outputs.as_of }}" \
            --replay-as-of "${{ steps.vars.outputs.replay }}" \
            $EXTRA

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              "industry_boom_ranking.json",
              "industry_boom_detail.json",
              "ai_replay_2022.json",
              "technology_momentum.json",
              "event_amount_quality.json",
              "cashflow_capex_quality.json",
              "macro_context.json",
              "bea_context.json",
              "korea_corroboration.json",
              "engine_health.json",
              "run_manifest.json",
              "model_validation.json",
              "ai_stage1_validation.json",
          ]
          for name in required:
              path = Path("outputs") / name
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"missing output: {path}")
              payload = json.loads(path.read_text(encoding="utf-8"))
              if "api_key=" in json.dumps(payload).lower() and "<redacted>" not in json.dumps(payload).lower():
                  raise SystemExit(f"unredacted secret detected: {path}")
          ranking = json.loads(Path("outputs/industry_boom_ranking.json").read_text(encoding="utf-8"))
          if len(ranking) < 5:
              raise SystemExit("ranking output is unexpectedly small")
          required_fields = {
              "early_signal_score",
              "commercial_realization_score",
              "cross_confirmation_score",
              "transition_gap_score",
          }
          missing = required_fields - set(ranking[0])
          if missing:
              raise SystemExit(f"missing V0.5 fields: {sorted(missing)}")
          print("OUTPUT_VALIDATION_OK")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: industry-boom-engine-output
          path: outputs/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit latest JSON
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/*.json
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore: refresh industry boom outputs v0.6.1"
            git push
          fi
