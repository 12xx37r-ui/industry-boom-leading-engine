name: Industry Boom Engine

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "현재 판정 기준일 (YYYY-MM-DD, 비우면 실행일)"
        required: false
        type: string
      replay_as_of:
        description: "AI 과거 재현 기준일"
        required: true
        default: "2022-10-31"
        type: string
      include_dart:
        description: "한국 OpenDART 보강 실행"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: industry-boom-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ible-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ible-cache-${{ runner.os }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Test
        run: pytest -q

      - name: Resolve inputs
        id: vars
        shell: bash
        run: |
          AS_OF="${{ inputs.as_of }}"
          if [ -z "$AS_OF" ]; then AS_OF="$(date -u +%F)"; fi
          REPLAY="${{ inputs.replay_as_of }}"
          if [ -z "$REPLAY" ]; then REPLAY="2022-10-31"; fi
          INCLUDE_DART="${{ inputs.include_dart }}"
          if [ -z "$INCLUDE_DART" ]; then INCLUDE_DART="true"; fi
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
          echo "replay=$REPLAY" >> "$GITHUB_OUTPUT"
          echo "include_dart=$INCLUDE_DART" >> "$GITHUB_OUTPUT"

      - name: Run engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        shell: bash
        run: |
          for NAME in FRED_API_KEY BEA_API_KEY OPENDART_API_KEY SEC_USER_AGENT; do
            if [ -z "${!NAME}" ]; then
              echo "MISSING_REQUIRED_CONFIGURATION: $NAME"
              exit 1
            fi
          done
          EXTRA=""
          if [ "${{ steps.vars.outputs.include_dart }}" = "true" ]; then EXTRA="--include-dart"; fi
          python -m ible.cli \
            --as-of "${{ steps.vars.outputs.as_of }}" \
            --replay-as-of "${{ steps.vars.outputs.replay }}" \
            $EXTRA

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              "industry_boom_ranking.json",
              "industry_boom_detail.json",
              "ai_replay_2022.json",
              "macro_context.json",
              "korea_corroboration.json",
              "engine_health.json",
              "run_manifest.json",
          ]
          for name in required:
              path = Path("outputs") / name
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"missing output: {path}")
              json.loads(path.read_text(encoding="utf-8"))
          ranking = json.loads(Path("outputs/industry_boom_ranking.json").read_text(encoding="utf-8"))
          if len(ranking) < 5:
              raise SystemExit("ranking output is unexpectedly small")
          print("OUTPUT_VALIDATION_OK")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: industry-boom-engine-output
          path: outputs/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit latest JSON
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/*.json
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore: refresh industry boom outputs"
            git push
          fi
