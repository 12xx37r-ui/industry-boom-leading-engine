name: 00 - ONLY RUN THIS - Industry Boom V4.0 Final Auto

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "최초 확인용 YYYY-MM-DD (일반 실행은 비워두기)"
        required: false
        type: string
  schedule:
    - cron: "20 3 * * 1"

permissions:
  contents: write

concurrency:
  group: industry-boom-v40-final-auto
  cancel-in-progress: false

jobs:
  full-final-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test V4 final release only
        run: python -m unittest -q tests.test_v40_release

      - name: Resolve run date
        id: vars
        shell: bash
        run: |
          RUN_DATE="${{ inputs.run_date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(TZ=Asia/Seoul date +%F)"; fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Refresh every upstream data layer and build V4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outputs/v3_data outputs/v31_real_economy outputs/v32_investment outputs/v33_auto outputs/v40_final_auto
          python -m ible.v3_data_cli --root . --output-dir outputs/v3_data --run-date "${{ steps.vars.outputs.run_date }}"
          python -m ible.v31_cli --root . --output-dir outputs/v31_real_economy --run-date "${{ steps.vars.outputs.run_date }}"
          python -m ible.v32_cli --root . --output-dir outputs/v32_investment --run-date "${{ steps.vars.outputs.run_date }}"
          python -m ible.v33_cli --root . --output-dir outputs/v33_auto --run-date "${{ steps.vars.outputs.run_date }}"
          python -m ible.v40_cli --root . --output-dir outputs/v40_final_auto --run-date "${{ steps.vars.outputs.run_date }}"

      - name: Verify final V4 outputs
        run: |
          test -s outputs/v40_final_auto/v40_run_summary.json
          test -s outputs/v40_final_auto/v40_direct_commercialization_observations.json
          test -s outputs/v40_final_auto/v40_prevalidation_candidate_ranking.json
          test -s outputs/v40_final_auto/v40_model_lock_verification.json
          test -s outputs/v40_final_auto/v40_next_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('outputs/v40_final_auto/v40_run_summary.json').read_text(encoding='utf-8'))
          observations = json.loads(Path('outputs/v40_final_auto/v40_direct_commercialization_observations.json').read_text(encoding='utf-8'))
          if summary['theme_count'] != 50:
              raise SystemExit(f"theme count mismatch: {summary}")
          if summary['direct_commercialization_observed_theme_count'] < 45:
              raise SystemExit(f"direct commercialization coverage failure: {summary}")
          if summary['model_lock']['status'] != 'LOCK_VERIFIED':
              raise SystemExit('model lock failed')
          if any(row.get('boom_score') is not None for row in observations['themes']):
              raise SystemExit('final boom score fabrication prohibited')
          if summary['manual_run_required_after_bootstrap'] is not False:
              raise SystemExit('automatic schedule flag failed')
          print(json.dumps({
              'status': summary['status'],
              'themes': summary['theme_count'],
              'direct_observed': summary['direct_commercialization_observed_theme_count'],
              'qss_direct': summary['qss_direct_revenue_theme_count'],
              'm3_proxy': summary['m3_shipments_proxy_theme_count'],
              'engine_progress': summary['engine_build_progress_percent'],
              'project_progress': summary['total_project_progress_percent'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit all current caches snapshots and final results
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data_cache -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find prospective_history -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find outputs/v40_final_auto -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          # 첫 정상 실행 후 이전 수동 워크플로를 저장소에서 정리합니다.
          git rm -f --ignore-unmatch \
            .github/workflows/run_v2_shadow.yml \
            .github/workflows/run_v31_real_economy.yml \
            .github/workflows/run_v32_investment.yml \
            .github/workflows/run_v33_final_auto.yml \
            .github/workflows/run_v3_data.yml
          if ! git diff --cached --quiet; then
            git commit -m "data: V4 final auto industry boom ${{ steps.vars.outputs.run_date }}"
            git push || true
          fi
          exit 0

      - name: Upload one final result artifact
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-v4.0-final-auto-result
          path: |
            outputs/v40_final_auto
            data_cache/latest/v40_direct_commercialization_observations.json
            prospective_history/prospective_evaluation_queue.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
