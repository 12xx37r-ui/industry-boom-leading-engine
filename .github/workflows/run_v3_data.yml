name: 00 - Industry Boom V3.0.1 Live Data Phase 1

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "검증용 실행일 YYYY-MM-DD (일반 실행은 비워두기)"
        required: false
        type: string
  schedule:
    - cron: "20 1 * * 1"

permissions:
  contents: write

concurrency:
  group: industry-boom-v3-live-data
  cancel-in-progress: false

jobs:
  collect-live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test V3 release only
        run: python -m unittest -q tests.test_v3_release

      - name: Resolve run date
        id: vars
        shell: bash
        run: |
          RUN_DATE="${{ inputs.run_date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(TZ=Asia/Seoul date +%F)"; fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Collect 50-theme public point-in-time observations
        run: |
          rm -rf outputs/v3_data
          python -m ible.v3_data_cli \
            --root . \
            --output-dir outputs/v3_data \
            --run-date "${{ steps.vars.outputs.run_date }}"

      - name: Verify V3 outputs and no fabricated boom scores
        run: |
          test -s outputs/v3_data/v3_run_summary.json
          test -s outputs/v3_data/v3_source_observations.json
          test -s outputs/v3_data/v3_phase1_data_signal_ranking.json
          test -s outputs/v3_data/v3_data_source_health.json
          test -s outputs/v3_data/v3_model_lock_verification.json
          test -s outputs/v3_data/v3_next_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('outputs/v3_data/v3_run_summary.json').read_text(encoding='utf-8'))
          observations = json.loads(Path('outputs/v3_data/v3_source_observations.json').read_text(encoding='utf-8'))
          if summary['theme_count'] != 50:
              raise SystemExit(f"theme count mismatch: {summary['theme_count']}")
          if summary['model_lock']['status'] != 'LOCK_VERIFIED':
              raise SystemExit('model lock failed')
          fabricated = [row['theme_id'] for row in observations['themes'] if row.get('boom_score') is not None]
          if fabricated:
              raise SystemExit(f"fabricated boom scores prohibited: {fabricated}")
          if summary['investment_use_allowed'] is not False:
              raise SystemExit('investment use must remain disabled')
          print(json.dumps({
              'status': summary['status'],
              'theme_count': summary['theme_count'],
              'phase1_observed': summary['phase1_observed_theme_count'],
              'partial': summary['partial_theme_count'],
              'unavailable': summary['unavailable_theme_count'],
              'source_cells': summary['source_cells'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit immutable dated data cache
        id: persist
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data_cache -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find outputs/v3_data -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          if git diff --cached --quiet; then
            echo '{"status":"NO_CHANGES"}' > outputs/v3_data/v3_persistence.json
          else
            git commit -m "data: V3 public observations ${{ steps.vars.outputs.run_date }}"
            if git push; then
              echo '{"status":"COMMITTED"}' > outputs/v3_data/v3_persistence.json
            else
              echo '{"status":"PUSH_FAILED","artifact_contains_results":true}' > outputs/v3_data/v3_persistence.json
            fi
          fi
          exit 0

      - name: Upload V3 result
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-v3.0.1-live-data-result
          path: |
            outputs/v3_data
            data_cache/latest
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
