name: 00 - Industry Boom V3.1 QCEW Real Economy

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "검증용 실행일 YYYY-MM-DD (일반 실행은 비워두기)"
        required: false
        type: string
  schedule:
    - cron: "40 1 * * 1"

permissions:
  contents: write

concurrency:
  group: industry-boom-v31-real-economy
  cancel-in-progress: false

jobs:
  collect-qcew-real-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test V3.1 release only
        run: python -m unittest -q tests.test_v31_release

      - name: Resolve run date
        id: vars
        shell: bash
        run: |
          RUN_DATE="${{ inputs.run_date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(TZ=Asia/Seoul date +%F)"; fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Collect QCEW employment establishment wage signals
        run: |
          rm -rf outputs/v31_real_economy
          python -m ible.v31_cli \
            --root . \
            --output-dir outputs/v31_real_economy \
            --run-date "${{ steps.vars.outputs.run_date }}"

      - name: Verify outputs and prohibit fabricated boom scores
        run: |
          test -s outputs/v31_real_economy/v31_run_summary.json
          test -s outputs/v31_real_economy/v31_real_economy_observations.json
          test -s outputs/v31_real_economy/v31_phase2_data_signal_ranking.json
          test -s outputs/v31_real_economy/v31_source_health.json
          test -s outputs/v31_real_economy/v31_model_lock_verification.json
          test -s outputs/v31_real_economy/v31_next_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('outputs/v31_real_economy/v31_run_summary.json').read_text(encoding='utf-8'))
          observations = json.loads(Path('outputs/v31_real_economy/v31_real_economy_observations.json').read_text(encoding='utf-8'))
          if summary['theme_count'] != 50:
              raise SystemExit(f"theme count mismatch: {summary['theme_count']}")
          if summary['model_lock']['status'] != 'LOCK_VERIFIED':
              raise SystemExit('model lock failed')
          fabricated = [row['theme_id'] for row in observations['themes'] if row.get('boom_score') is not None]
          if fabricated:
              raise SystemExit(f"fabricated boom scores prohibited: {fabricated}")
          if summary['investment_use_allowed'] is not False:
              raise SystemExit('investment use must remain disabled')
          print(json.dumps({
              'status': summary['status'],
              'qcew_quarter': summary['qcew_quarter'],
              'theme_count': summary['theme_count'],
              'phase2_observed': summary['phase2_observed_theme_count'],
              'qcew_source_cells': summary['qcew_source_cells'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit dated cache and outputs
        id: persist
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data_cache -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find outputs/v31_real_economy -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          if git diff --cached --quiet; then
            echo '{"status":"NO_CHANGES"}' > outputs/v31_real_economy/v31_persistence.json
          else
            git commit -m "data: V3.1 QCEW real economy ${{ steps.vars.outputs.run_date }}"
            if git push; then
              echo '{"status":"COMMITTED"}' > outputs/v31_real_economy/v31_persistence.json
            else
              echo '{"status":"PUSH_FAILED","artifact_contains_results":true}' > outputs/v31_real_economy/v31_persistence.json
            fi
          fi
          exit 0

      - name: Upload V3.1 result
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-v3.1-qcew-real-economy-result
          path: |
            outputs/v31_real_economy
            data_cache/latest
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
