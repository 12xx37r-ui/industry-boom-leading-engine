name: Industry Boom V1.0.2 GitHub Only Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install test dependency
        run: python -m pip install -r requirements.txt

      - name: Verify repository and frozen model
        run: python -m pytest -q -p no:cacheprovider

      - name: Run GitHub-only locked validation
        run: |
          rm -rf outputs/v1_github
          python -m ible.github_validation_cli \
            --root . \
            --output-dir outputs/v1_github

      - name: Verify outputs
        run: |
          test -s outputs/v1_github/v1_github_validation_summary.json
          test -s outputs/v1_github/v1_github_validation_ranking.json
          test -s outputs/v1_github/v1_model_lock_verification.json
          python - <<'PY'
          import json
          p='outputs/v1_github/v1_github_validation_summary.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['execution_mode']=='github_actions_only'
          assert d['network_collection_used'] is False
          assert d['bat_cmd_colab_used'] is False
          assert d['investment_use_allowed'] is False
          assert d['model_lock']['status']=='LOCK_VERIFIED'
          print(json.dumps({
              'status': d['status'],
              'metrics': d['metrics'],
              'external_holdout': d['independent_external_holdout'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-v1.0.2-github-only-result
          path: outputs/v1_github
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
