name: Industry Boom V1.0.4 GitHub Robust Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install release test dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test only V1.0.4 release files
        run: python -m pytest -q -p no:cacheprovider tests/test_release.py

      - name: Run GitHub-only locked validation
        run: |
          rm -rf outputs/v1_github
          python -m ible.github_validation_cli \
            --root . \
            --output-dir outputs/v1_github

      - name: Verify generated outputs
        run: |
          test -s outputs/v1_github/v1_github_validation_summary.json
          test -s outputs/v1_github/v1_github_validation_ranking.json
          test -s outputs/v1_github/v1_model_lock_verification.json
          python - <<'PY'
          import json
          with open('outputs/v1_github/v1_github_validation_summary.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d['execution_mode']=='github_actions_only'
          assert d['network_collection_used'] is False
          assert d['bat_cmd_colab_used'] is False
          assert d['investment_use_allowed'] is False
          assert d['model_lock']['status']=='LOCK_VERIFIED'
          print(json.dumps({
              'status': d['status'],
              'metrics': d['metrics'],
              'external_holdout': d['independent_external_holdout'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload validation result
        uses: actions/upload-artifact@v4
        with:
          name: industry-boom-v1.0.4-github-result
          path: outputs/v1_github
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
