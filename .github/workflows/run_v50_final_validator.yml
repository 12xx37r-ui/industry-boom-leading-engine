name: 00 - RUN THIS ONLY - Industry Boom V7.3 Embedded Capital Radar Engine

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "확인용 YYYY-MM-DD (일반 실행은 비워두기)"
        required: false
        type: string
  schedule:
    - cron: "20 3 * * 1"

permissions:
  contents: write

concurrency:
  group: industry-boom-v70-complete-engine
  cancel-in-progress: false

jobs:
  prospective-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test V7 engine release only
        run: |
          python -m unittest -q tests.test_v62_release
          python -m ible.v73_embedded_radar --root . --test-only --timeout-seconds 60

      - name: Resolve run date
        id: vars
        shell: bash
        run: |
          RUN_DATE="${{ inputs.run_date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(TZ=Asia/Seoul date +%F)"; fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Refresh current data with bounded cache fallback
        shell: bash
        run: |
          set -uo pipefail
          rm -rf outputs/v3_data outputs/v31_real_economy outputs/v32_investment outputs/v33_auto outputs/v40_final_auto outputs/v50_final_validator outputs/v51_historical_audit outputs/v60_champion_challenger outputs/v70_final_engine
          run_stage() {
            local seconds="$1"; shift
            local label="$1"; shift
            echo "[STAGE] $label"
            if timeout --signal=TERM --kill-after=30s "$seconds" "$@"; then
              echo "[STAGE-OK] $label"
            else
              echo "::warning::$label live refresh failed or timed out; sealed latest cache will be used"
            fi
          }
          run_stage 900 "Embedded Capital Radar" python -m ible.v73_embedded_radar --root . --mode weekly --timeout-seconds 840
          run_stage 720 "V3 research and government sources" python -m ible.v3_data_cli --root . --output-dir outputs/v3_data --run-date "${{ steps.vars.outputs.run_date }}"
          run_stage 480 "V3.1 real economy" python -m ible.v31_cli --root . --output-dir outputs/v31_real_economy --run-date "${{ steps.vars.outputs.run_date }}"
          run_stage 300 "V3.2 corporate investment" python -m ible.v32_cli --root . --output-dir outputs/v32_investment --run-date "${{ steps.vars.outputs.run_date }}"
          run_stage 180 "V3.3 integration" python -m ible.v33_cli --root . --output-dir outputs/v33_auto --run-date "${{ steps.vars.outputs.run_date }}"
          run_stage 480 "V4 direct commercialization" python -m ible.v40_cli --root . --output-dir outputs/v40_final_auto --run-date "${{ steps.vars.outputs.run_date }}"
          for required in \
            data_cache/latest/v31_real_economy_observations.json \
            data_cache/latest/v32_corporate_investment_observations.json \
            data_cache/latest/v33_phase4_observations.json \
            data_cache/latest/v40_direct_commercialization_observations.json; do
            test -s "$required" || { echo "required cache missing: $required"; exit 1; }
          done
          set -euo pipefail
          python -m ible.v50_cli --root . --output-dir outputs/v50_final_validator --run-date "${{ steps.vars.outputs.run_date }}"

      - name: Run sealed historical audit
        shell: bash
        run: |
          set -euo pipefail
          python -m ible.v51_cli \
            --root . \
            --output-dir outputs/v51_historical_audit \
            --v50-output-dir outputs/v50_final_validator \
            --run-date "${{ steps.vars.outputs.run_date }}"

      - name: Run V6.0 research comparison
        shell: bash
        run: |
          set -euo pipefail
          python -m ible.v60_cli \
            --root . \
            --output-dir outputs/v60_champion_challenger \
            --v51-output-dir outputs/v51_historical_audit \
            --run-date "${{ steps.vars.outputs.run_date }}"

      - name: Build complete V7 operational scores and immutable snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -m ible.v61_cli \
            --root . \
            --output-dir outputs/v70_final_engine \
            --v50-output-dir outputs/v50_final_validator \
            --v60-output-dir outputs/v60_champion_challenger \
            --run-date "${{ steps.vars.outputs.run_date }}"

      - name: Verify V7 outputs
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            v70_run_summary.json \
            v70_current_operational_snapshot.json \
            v70_operational_registry.json \
            v70_prospective_scorecard.json \
            v70_policy_lock_verification.json \
            v70_dashboard_payload.json \
            v70_next_gate.json; do
            test -s "outputs/v70_final_engine/$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('outputs/v70_final_engine/v70_run_summary.json').read_text(encoding='utf-8'))
          if summary['policy_lock']['status'] != 'POLICY_LOCK_VERIFIED':
              raise SystemExit('V6.1 policy lock failed')
          if summary['theme_count'] != 50:
              raise SystemExit(f"theme count mismatch: {summary['theme_count']}")
          if summary['challenger_live_alert_count'] < summary['champion_live_alert_count']:
              raise SystemExit('challenger cannot remove champion alerts')
          if summary['boom_score_count'] != 50:
              raise SystemExit('boom scores missing')
          if summary['capital_accumulation_score_count'] != 50:
              raise SystemExit('capital accumulation scores missing')
          if summary['public_interest_coverage_count'] < 40:
              raise SystemExit('observed public-interest coverage below 80%')
          if summary['hidden_opportunity_eligible_count'] <= 0:
              raise SystemExit('no evidence-qualified hidden opportunities')
          if summary.get('preboom_eligible_count', 0) <= 0:
              raise SystemExit('no strict low-attention, independently confirmed pre-boom candidates')
          if summary['company_mapping_count'] != 50:
              raise SystemExit('company mappings missing')
          if summary['capital_radar_mapped_theme_count'] < 25:
              print('WARNING: Capital Radar bridge is stale, unavailable, or below coverage minimum; Champion remains active')
          print(json.dumps({
              'status': summary['status'],
              'snapshot_action': summary['snapshot_action'],
              'snapshot_count': summary['snapshot_count'],
              'champion_live_alert_count': summary['champion_live_alert_count'],
              'challenger_live_alert_count': summary['challenger_live_alert_count'],
              'added_theme_ids': summary['added_theme_ids'],
              'next_evaluation_due': summary['next_evaluation_due'],
              'public_interest_coverage_count': summary['public_interest_coverage_count'],
              'public_interest_missing_count': summary['public_interest_missing_count'],
              'capital_accumulation_score_count': summary['capital_accumulation_score_count'],
              'hidden_opportunity_eligible_count': summary['hidden_opportunity_eligible_count'],
              'preboom_eligible_count': summary['preboom_eligible_count'],
              'boom_score_count': summary['boom_score_count'],
              'three_month_change_count': summary['three_month_change_count'],
              'company_mapping_count': summary['company_mapping_count'],
              'capital_radar_mapped_theme_count': summary['capital_radar_mapped_theme_count'],
              'integrated_hidden_score_count': summary['integrated_hidden_score_count'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit immutable histories and outputs
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data_cache -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find prospective_history -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find historical_history -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find outputs/v50_final_validator outputs/v51_historical_audit outputs/v60_champion_challenger outputs/v70_final_engine -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          for workflow in .github/workflows/*; do
            [ -e "$workflow" ] || continue
            if [ "$(basename "$workflow")" != "run_v50_final_validator.yml" ]; then
              git rm -f --ignore-unmatch "$workflow"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "validation: V7.3 embedded-capital-radar ledger ${{ steps.vars.outputs.run_date }}"
            git push || true
          fi
          exit 0

      - name: Upload combined result artifact
        uses: actions/upload-artifact@v4
        with:
          name: industry-boom-v7.3-embedded-capital-radar-engine-result
          path: |
            outputs/v50_final_validator
            outputs/v51_historical_audit
            outputs/v60_champion_challenger
            outputs/v70_final_engine
            historical_history/v51_audits
            historical_history/v60_audits
            prospective_history/v50_snapshot_registry.json
            prospective_history/v50_snapshots
            prospective_history/v50_evaluations
            prospective_history/v73_operational_registry.json
            prospective_history/v73_operational_snapshots
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
