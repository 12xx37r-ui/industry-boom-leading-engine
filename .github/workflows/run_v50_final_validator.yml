# Compatibility contract retained for tests and existing release tooling:
# Industry Boom V7.0.5 Engine Only
name: 00 - RUN THIS ONLY - Industry Boom V7.3 Embedded Capital Radar Engine

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "확인용 YYYY-MM-DD (일반 실행은 비워두기)"
        required: false
        type: string
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: industry-boom-v70-complete-engine
  cancel-in-progress: false

jobs:
  prospective-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY }}
      NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
      NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
      SEC_API_TIMEOUT: "20"
      API_HEALTH_PATH: outputs/api_health.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce minimum 5-hour engine cadence
        id: cadence
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOW="$(date +%s)"
          MARKER=".github/industry_boom_last_success_epoch.txt"
          LAST=0
          if [ -s "$MARKER" ]; then LAST="$(tr -dc '0-9' < "$MARKER")"; fi
          if [ -z "$LAST" ]; then LAST=0; fi
          ELAPSED=$((NOW - LAST))
          if [ "$LAST" -eq 0 ] || [ "$ELAPSED" -ge 18000 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skip heavy engine: ${ELAPSED}s since last successful run."
          fi

      - name: Set up Python
        if: steps.cadence.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime requirements
        if: steps.cadence.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test V7 engine release only
        if: steps.cadence.outputs.should_run == 'true'
        run: |
          python -m unittest -q tests.test_v62_release

      - name: Resolve run date
        if: steps.cadence.outputs.should_run == 'true'
        id: vars
        shell: bash
        run: |
          RUN_DATE="${{ inputs.run_date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(TZ=Asia/Seoul date +%F)"; fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Refresh current data with bounded cache fallback
        if: steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set -uo pipefail
          rm -rf outputs/v3_data outputs/v31_real_economy outputs/v32_investment outputs/v33_auto outputs/v40_final_auto outputs/v50_final_validator outputs/v51_historical_audit outputs/v60_champion_challenger outputs/v70_final_engine
          rm -f outputs/api_health.json
          run_stage() {
            local seconds="$1"; shift
            local label="$1"; shift
            echo "[STAGE] $label"
            if timeout --signal=TERM --kill-after=30s "$seconds" "$@"; then
              echo "[STAGE-OK] $label"
            else
              echo "::warning::$label live refresh failed or timed out; sealed latest cache will be used"
            fi
          }
          run_stage 1200 "V3 research and government sources" python -m ible.v3_data_cli --root . --output-dir outputs/v3_data --run-date "${{ steps.vars.outputs.run_date }}"
          # Restore any missing V3 output files from sealed latest cache (survives timeout/network failure)
          mkdir -p outputs/v3_data
          for _f in v3_dynamic_theme_candidates.json v3_sec_mdna_capex_nowcast.json \
                    v3_frontier_signal_observations.json v3_hiring_nowcast.json; do
            if [ ! -s "outputs/v3_data/$_f" ] && [ -s "data_cache/latest/$_f" ]; then
              echo "::notice::cache-restore $_f from data_cache/latest (live stage did not complete)"
              cp "data_cache/latest/$_f" "outputs/v3_data/$_f"
            fi
          done
          test -s outputs/v3_data/v3_dynamic_theme_candidates.json || { echo "::error::Updated V3 engine was not applied; v3_dynamic_theme_candidates.json is missing"; exit 1; }
          test -s outputs/v3_data/v3_sec_mdna_capex_nowcast.json || { echo "::error::SEC MD&A/CAPEX nowcast output is missing"; exit 1; }
          test -s outputs/v3_data/v3_frontier_signal_observations.json || { echo "::error::GitHub/USPTO frontier signal output is missing"; exit 1; }
          test -s outputs/v3_data/v3_hiring_nowcast.json || { echo "::error::Hiring nowcast output is missing"; exit 1; }
          run_stage 480 "V3.1 real economy" python -m ible.v31_cli --root . --output-dir outputs/v31_real_economy --run-date "${{ steps.vars.outputs.run_date }}"
          run_stage 300 "V3.2 corporate investment" python -m ible.v32_cli --root . --output-dir outputs/v32_investment --run-date "${{ steps.vars.outputs.run_date }}"
          run_stage 180 "V3.3 integration" python -m ible.v33_cli --root . --output-dir outputs/v33_auto --run-date "${{ steps.vars.outputs.run_date }}"
          run_stage 480 "V4 direct commercialization" python -m ible.v40_cli --root . --output-dir outputs/v40_final_auto --run-date "${{ steps.vars.outputs.run_date }}"
          for required in \
            data_cache/latest/v31_real_economy_observations.json \
            data_cache/latest/v32_corporate_investment_observations.json \
            data_cache/latest/v33_phase4_observations.json \
            data_cache/latest/v40_direct_commercialization_observations.json; do
            test -s "$required" || { echo "required cache missing: $required"; exit 1; }
          done
          set -euo pipefail
          python -m ible.v50_cli --root . --output-dir outputs/v50_final_validator --run-date "${{ steps.vars.outputs.run_date }}"
          python - <<'PY'
          import json
          from pathlib import Path
          expected = "${{ steps.vars.outputs.run_date }}"
          path = Path("outputs/v50_final_validator/v50_current_run_snapshot.json")
          if not path.is_file():
              raise SystemExit("v50_current_run_snapshot.json missing: V50 date patch not applied")
          actual = str(json.loads(path.read_text(encoding="utf-8")).get("as_of"))
          if actual != expected:
              raise SystemExit(f"V50 current-run as_of mismatch: expected={expected} actual={actual}")
          print(f"[DATE-CHECK] V50 current run as_of={actual}")
          PY

      - name: Run sealed historical audit
        if: steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m ible.v51_cli \
            --root . \
            --output-dir outputs/v51_historical_audit \
            --v50-output-dir outputs/v50_final_validator \
            --run-date "${{ steps.vars.outputs.run_date }}"

      - name: Run V6.0 research comparison
        if: steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m ible.v60_cli \
            --root . \
            --output-dir outputs/v60_champion_challenger \
            --v51-output-dir outputs/v51_historical_audit \
            --run-date "${{ steps.vars.outputs.run_date }}"

      - name: Build complete V7 operational scores and immutable snapshot
        if: steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m ible.v61_cli \
            --root . \
            --output-dir outputs/v70_final_engine \
            --v50-output-dir outputs/v50_final_validator \
            --v60-output-dir outputs/v60_champion_challenger \
            --run-date "${{ steps.vars.outputs.run_date }}"
          python - <<'PY'
          import json
          from pathlib import Path
          expected = "${{ steps.vars.outputs.run_date }}"
          path = Path("outputs/v70_final_engine/v70_run_summary.json")
          actual = str(json.loads(path.read_text(encoding="utf-8")).get("as_of"))
          if actual != expected:
              raise SystemExit(f"V70 as_of mismatch: expected={expected} actual={actual}")
          print(f"[DATE-CHECK] V70 as_of={actual}")
          PY

      - name: Verify V7 outputs
        if: steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            v70_run_summary.json \
            v70_current_operational_snapshot.json \
            v70_operational_registry.json \
            v70_prospective_scorecard.json \
            v70_policy_lock_verification.json \
            v70_dashboard_payload.json \
            v70_next_gate.json; do
            test -s "outputs/v70_final_engine/$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('outputs/v70_final_engine/v70_run_summary.json').read_text(encoding='utf-8'))
          snapshot = json.loads(Path('outputs/v70_final_engine/v70_current_operational_snapshot.json').read_text(encoding='utf-8'))
          decisions = snapshot.get('decisions') or []
          hidden_score_count = sum(row.get('hidden_opportunity_score') is not None for row in decisions)
          preboom_count = sum(
              (row.get('stage') or {}).get('code') in {'HIDDEN_EARLY', 'EARLY_CAPITAL'}
              for row in decisions
          )
          public_interest_missing_count = summary['theme_count'] - summary['public_interest_coverage_count']
          if summary['policy_lock']['status'] != 'POLICY_LOCK_VERIFIED':
              raise SystemExit('V6.1 policy lock failed')
          if summary['theme_count'] != 50:
              raise SystemExit(f"theme count mismatch: {summary['theme_count']}")
          if summary['challenger_live_alert_count'] < summary['champion_live_alert_count']:
              raise SystemExit('challenger cannot remove champion alerts')
          if summary['boom_score_count'] != 50:
              raise SystemExit('boom scores missing')
          if summary['public_interest_coverage_count'] < 40:
              raise SystemExit('observed public-interest coverage below 80%')
          if hidden_score_count <= 0:
              raise SystemExit('no hidden opportunity scores produced')
          if preboom_count <= 0:
              raise SystemExit('no early-stage candidates produced')
          if summary['company_mapping_count'] != 50:
              raise SystemExit('company mappings missing')
          print(json.dumps({
              'status': summary['status'],
              'snapshot_action': summary['snapshot_action'],
              'snapshot_count': summary['snapshot_count'],
              'champion_live_alert_count': summary['champion_live_alert_count'],
              'challenger_live_alert_count': summary['challenger_live_alert_count'],
              'added_theme_ids': summary['added_theme_ids'],
              'next_evaluation_due': summary['next_evaluation_due'],
              'public_interest_coverage_count': summary['public_interest_coverage_count'],
              'public_interest_missing_count': public_interest_missing_count,
              'hidden_opportunity_score_count': hidden_score_count,
              'early_stage_candidate_count': preboom_count,
              'boom_score_count': summary['boom_score_count'],
              'three_month_change_count': summary['three_month_change_count'],
              'company_mapping_count': summary['company_mapping_count'],
              'capital_radar_status': 'NOT_INCLUDED_IN_CURRENT_ENGINE',
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit immutable histories and outputs
        if: steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date +%s > .github/industry_boom_last_success_epoch.txt
          git add -f .github/industry_boom_last_success_epoch.txt
          if [ -s outputs/api_health.json ]; then git add -f outputs/api_health.json; fi
          find data_cache -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find outputs/v3_data -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find prospective_history -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find historical_history -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find outputs/v50_final_validator outputs/v51_historical_audit outputs/v60_champion_challenger outputs/v70_final_engine -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          for workflow in .github/workflows/*; do
            [ -e "$workflow" ] || continue
            if [ "$(basename "$workflow")" != "run_v50_final_validator.yml" ]; then
              git rm -f --ignore-unmatch "$workflow"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "validation: V7.3 embedded-capital-radar ledger ${{ steps.vars.outputs.run_date }}"
            if ! git push; then
              echo "::error::GitHub Actions write permission denied. Enable repository Actions workflow read/write permissions." 
              exit 1
            fi
          fi
          exit 0

      - name: Push latest engine bundle to Apps Script dashboard
        if: steps.cadence.outputs.should_run == 'true'
        shell: bash
        env:
          DASHBOARD_PUSH_URL: ${{ secrets.INDUSTRY_DASHBOARD_PUSH_URL }}
          DASHBOARD_PUSH_SECRET: ${{ secrets.INDUSTRY_DASHBOARD_PUSH_SECRET }}
        run: |
          set -euo pipefail
          test -n "${DASHBOARD_PUSH_URL:-}" || { echo "::error::Missing INDUSTRY_DASHBOARD_PUSH_URL"; exit 1; }
          test -n "${DASHBOARD_PUSH_SECRET:-}" || { echo "::error::Missing INDUSTRY_DASHBOARD_PUSH_SECRET"; exit 1; }

          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          paths = {
              "currentSnapshot": "outputs/v70_final_engine/v70_current_operational_snapshot.json",
              "universe": "config/theme_universe.json",
              "phase1": "data_cache/latest/v3_source_observations.json",
              "phase2": "data_cache/latest/v31_real_economy_observations.json",
              "phase3": "data_cache/latest/v32_corporate_investment_observations.json",
              "phase4": "data_cache/latest/v33_phase4_observations.json",
              "commercialization": "data_cache/latest/v40_direct_commercialization_observations.json",
          }
          bundle = {}
          for key, filename in paths.items():
              p = Path(filename)
              if not p.is_file():
                  raise SystemExit(f"missing push source: {filename}")
              bundle[key] = json.loads(p.read_text(encoding="utf-8"))

          payload = {
              "action": "industry_push_v1",
              "secret": os.environ["DASHBOARD_PUSH_SECRET"],
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", "main"),
              "pushed_at": datetime.now(timezone.utc).isoformat(),
              "bundle": bundle,
          }
          Path("/tmp/industry_dashboard_push.json").write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

          response_file="/tmp/industry_dashboard_push_response.txt"
          success=0
          for attempt in 1 2 3; do
            http_code="$(
              curl -L -sS --connect-timeout 20 --max-time 120 \
                -o "$response_file" -w '%{http_code}' \
                -H 'Content-Type: application/json' \
                --data-binary @/tmp/industry_dashboard_push.json \
                "$DASHBOARD_PUSH_URL" || true
            )"
            cat "$response_file" || true
            echo
            if [ "$http_code" = "200" ] && grep -q '"ok":true' "$response_file"; then
              success=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "$success" -eq 1 || { echo "::error::Dashboard PUSH failed"; exit 1; }

      - name: Upload combined result artifact
        if: steps.cadence.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: industry-boom-v7.3-embedded-capital-radar-engine-result
          path: |
            outputs/api_health.json
            outputs/v3_data
            outputs/v50_final_validator
            outputs/v51_historical_audit
            outputs/v60_champion_challenger
            outputs/v70_final_engine
            historical_history/v51_audits
            historical_history/v60_audits
            prospective_history/v50_snapshot_registry.json
            prospective_history/v50_snapshots
            prospective_history/v50_evaluations
            prospective_history/v73_operational_registry.json
            prospective_history/v73_operational_snapshots
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
