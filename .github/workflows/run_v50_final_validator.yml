name: 00 - RUN THIS ONLY - Industry Boom V5 Final Validator

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "최초 확인용 YYYY-MM-DD (일반 실행은 비워두기)"
        required: false
        type: string
  schedule:
    - cron: "20 3 * * 1"

permissions:
  contents: write

concurrency:
  group: industry-boom-v50-final-validator
  cancel-in-progress: false

jobs:
  final-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test V5 final release only
        run: python -m unittest -q tests.test_v50_release

      - name: Resolve run date
        id: vars
        shell: bash
        run: |
          RUN_DATE="${{ inputs.run_date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(TZ=Asia/Seoul date +%F)"; fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Refresh all data and run final prospective validator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outputs/v3_data outputs/v31_real_economy outputs/v32_investment outputs/v33_auto outputs/v40_final_auto outputs/v50_final_validator
          python -m ible.v3_data_cli --root . --output-dir outputs/v3_data --run-date "${{ steps.vars.outputs.run_date }}"
          python -m ible.v31_cli --root . --output-dir outputs/v31_real_economy --run-date "${{ steps.vars.outputs.run_date }}"
          python -m ible.v32_cli --root . --output-dir outputs/v32_investment --run-date "${{ steps.vars.outputs.run_date }}"
          python -m ible.v33_cli --root . --output-dir outputs/v33_auto --run-date "${{ steps.vars.outputs.run_date }}"
          python -m ible.v40_cli --root . --output-dir outputs/v40_final_auto --run-date "${{ steps.vars.outputs.run_date }}"
          python -m ible.v50_cli --root . --output-dir outputs/v50_final_validator --run-date "${{ steps.vars.outputs.run_date }}"

      - name: Verify final V5 outputs
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            v50_run_summary.json \
            v50_current_monthly_snapshot.json \
            v50_candidate_ranking.json \
            v50_prospective_scorecard.json \
            v50_snapshot_registry.json \
            v50_dashboard_payload.json \
            v50_model_lock_verification.json \
            v50_next_gate.json; do
            test -s "outputs/v50_final_validator/$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('outputs/v50_final_validator')
          summary = json.loads((base / 'v50_run_summary.json').read_text(encoding='utf-8'))
          ranking = json.loads((base / 'v50_candidate_ranking.json').read_text(encoding='utf-8'))
          if summary['theme_count'] != 50:
              raise SystemExit(f"theme count mismatch: {summary}")
          if summary['commercialization_coverage_theme_count'] != 50:
              raise SystemExit(f"commercialization coverage mismatch: {summary}")
          if summary['model_lock']['status'] != 'LOCK_VERIFIED':
              raise SystemExit('model lock failed')
          if summary['engine_build_progress_percent'] != 100:
              raise SystemExit(f"engine build incomplete: {summary}")
          if summary['manual_run_required_after_bootstrap'] is not False:
              raise SystemExit('automatic schedule flag failed')
          if any(row.get('boom_score') is not None for row in ranking['ranking']):
              raise SystemExit('final boom score fabrication prohibited')
          print(json.dumps({
              'status': summary['status'],
              'themes': summary['theme_count'],
              'commercialization_coverage': summary['commercialization_coverage_theme_count'],
              'monthly_snapshots': summary['monthly_snapshot_count'],
              'matured_evaluations': summary['total_matured_evaluation_count'],
              'next_due': summary['next_evaluation_due'],
              'engine_progress': summary['engine_build_progress_percent'],
              'project_progress': summary['total_project_progress_percent'],
              'investment_use_allowed': summary['investment_use_allowed'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit caches immutable snapshots evaluations and V5 outputs
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data_cache -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find prospective_history -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find outputs/v50_final_validator -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          for workflow in .github/workflows/*; do
            [ -e "$workflow" ] || continue
            if [ "$(basename "$workflow")" != "run_v50_final_validator.yml" ]; then
              git rm -f --ignore-unmatch "$workflow"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: V5 prospective validator ${{ steps.vars.outputs.run_date }}"
            git push || true
          fi
          exit 0

      - name: Upload one final result artifact
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-v5.0-final-validator-result
          path: |
            outputs/v50_final_validator
            prospective_history/v50_snapshot_registry.json
            prospective_history/v50_snapshots
            prospective_history/v50_evaluations
            data_cache/latest/v40_direct_commercialization_observations.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
