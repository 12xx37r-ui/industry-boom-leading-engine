name: Industry Boom Independent Walkforward V1.0.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -c "import ible, ible.walkforward_seed_cli, ible.walkforward_cli; print('IBLE_IMPORT_OK', ible.__version__)"
          python -m pytest -q
      - name: Validate independent walkforward seeds
        run: |
          set -euo pipefail
          python -m ible.walkforward_seed_cli --root . --validate-only
      - name: Run frozen V0.9.1 walkforward
        run: |
          set -euo pipefail
          rm -rf outputs/walkforward_v100
          python -m ible.walkforward_cli --root . --output-dir outputs/walkforward_v100
      - name: Validate outputs
        run: |
          set -euo pipefail
          test -s outputs/walkforward_v100/walkforward_summary.json
          test -s outputs/walkforward_v100/walkforward_scenarios.json
          python - <<'PY'
          import json
          p=json.load(open('outputs/walkforward_v100/walkforward_summary.json',encoding='utf-8'))
          print(json.dumps({
            'status':p['status'],
            'model_version':p['model_version'],
            'validation_engine_version':p['validation_engine_version'],
            'model_lock_passed':p['model_lock']['passed'],
            'metrics':p['metrics'],
          },ensure_ascii=False,indent=2))
          assert p['status'] in {'PASSED_V1_INDEPENDENT_WALKFORWARD','FAILED_V1_INDEPENDENT_WALKFORWARD'}
          assert p['investment_use_allowed'] is False
          assert p['model_version'] == '0.9.1'
          assert p['validation_engine_version'] == '1.0.0'
          assert p['model_lock']['passed'] is True
          assert len(p['snapshots']) == 2
          PY
      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-independent-walkforward-v1.0.0
          path: outputs/walkforward_v100
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
