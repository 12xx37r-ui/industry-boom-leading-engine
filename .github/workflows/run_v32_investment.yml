name: 00 - Industry Boom V3.2 Corporate Investment

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "검증용 실행일 YYYY-MM-DD (일반 실행은 비워두기)"
        required: false
        type: string
  schedule:
    - cron: "10 2 * * 1"

permissions:
  contents: write

concurrency:
  group: industry-boom-v32-corporate-investment
  cancel-in-progress: false

jobs:
  collect-corporate-investment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test V3.2 release only
        run: python -m unittest -q tests.test_v32_release

      - name: Resolve run date
        id: vars
        shell: bash
        run: |
          RUN_DATE="${{ inputs.run_date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(TZ=Asia/Seoul date +%F)"; fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Collect AIES CAPEX and BERD business R&D
        run: |
          rm -rf outputs/v32_investment
          python -m ible.v32_cli \
            --root . \
            --output-dir outputs/v32_investment \
            --run-date "${{ steps.vars.outputs.run_date }}"

      - name: Verify outputs and prohibit fabricated boom scores
        run: |
          test -s outputs/v32_investment/v32_run_summary.json
          test -s outputs/v32_investment/v32_corporate_investment_observations.json
          test -s outputs/v32_investment/v32_phase3_investment_signal_ranking.json
          test -s outputs/v32_investment/v32_source_health.json
          test -s outputs/v32_investment/v32_model_lock_verification.json
          test -s outputs/v32_investment/v32_next_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('outputs/v32_investment/v32_run_summary.json').read_text(encoding='utf-8'))
          observations = json.loads(Path('outputs/v32_investment/v32_corporate_investment_observations.json').read_text(encoding='utf-8'))
          if summary['theme_count'] != 50:
              raise SystemExit(f"theme count mismatch: {summary['theme_count']}")
          if summary['model_lock']['status'] != 'LOCK_VERIFIED':
              raise SystemExit('model lock failed')
          fabricated = [row['theme_id'] for row in observations['themes'] if row.get('boom_score') is not None]
          if fabricated:
              raise SystemExit(f"fabricated boom scores prohibited: {fabricated}")
          if summary['investment_use_allowed'] is not False:
              raise SystemExit('investment use must remain disabled')
          if summary['capex_observed_theme_count'] < 40:
              raise SystemExit(f"insufficient CAPEX coverage: {summary['capex_observed_theme_count']}")
          if summary['business_rd_observed_theme_count'] < 35:
              raise SystemExit(f"insufficient R&D coverage: {summary['business_rd_observed_theme_count']}")
          print(json.dumps({
              'status': summary['status'],
              'theme_count': summary['theme_count'],
              'phase3_observed': summary['phase3_observed_theme_count'],
              'capex_observed': summary['capex_observed_theme_count'],
              'business_rd_observed': summary['business_rd_observed_theme_count'],
              'source_status': summary['source_status'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit dated cache and outputs
        id: persist
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data_cache -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          find outputs/v32_investment -type f -name '*.json' -print0 | xargs -0 -r git add -f --
          if git diff --cached --quiet; then
            echo '{"status":"NO_CHANGES"}' > outputs/v32_investment/v32_persistence.json
          else
            git commit -m "data: V3.2 corporate investment ${{ steps.vars.outputs.run_date }}"
            if git push; then
              echo '{"status":"COMMITTED"}' > outputs/v32_investment/v32_persistence.json
            else
              echo '{"status":"PUSH_FAILED","artifact_contains_results":true}' > outputs/v32_investment/v32_persistence.json
            fi
          fi
          exit 0

      - name: Upload V3.2 result
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-v3.2-corporate-investment-result
          path: |
            outputs/v32_investment
            data_cache/latest
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
