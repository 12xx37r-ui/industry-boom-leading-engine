name: Industry Boom Offline Holdout V0.8.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -c "import ible, ible.offline_seed_cli, ible.global_holdout_cli; print('IBLE_IMPORT_OK', ible.__version__)"
          python -m pytest -q
      - name: Validate checked-in offline seed
        run: |
          set -euo pipefail
          python -m ible.offline_seed_cli --root . --validate-only
      - name: Run zero-network global holdout
        run: |
          set -euo pipefail
          rm -rf outputs/global_holdout
          python -m ible.global_holdout_cli --root . --output-dir outputs/global_holdout
      - name: Validate outputs
        run: |
          set -euo pipefail
          test -s outputs/global_holdout/global_holdout_summary.json
          test -s outputs/global_holdout/global_holdout_ranking.json
          python - <<'PY'
          import json
          p=json.load(open('outputs/global_holdout/global_holdout_summary.json',encoding='utf-8'))
          print(json.dumps({
            'status':p['status'],
            'financial_source':p['financial_source'],
            'dataset_gate_passed':p['dataset_gate_passed'],
            'metrics':p['metrics'],
            'financial_data':{
              'status':p['financial_data'].get('status'),
              'requested':p['financial_data'].get('requested'),
              'historically_eligible_count':p['financial_data'].get('historically_eligible_count'),
              'available':p['financial_data'].get('available'),
              'coverage':p['financial_data'].get('coverage_of_historically_eligible'),
              'research_available':p['financial_data'].get('research_available'),
            },
          },ensure_ascii=False,indent=2))
          assert p.get('investment_use_allowed') is False
          assert p.get('financial_source') == 'offline_sec_fsds_plus_arxiv_seed'
          assert p.get('dataset_gate_passed') is True
          assert p.get('status') in {
            'PASSED_V087_GLOBAL_HOLDOUT',
            'FAILED_V087_GLOBAL_HOLDOUT',
          }
          PY
      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-global-holdout-v0.8.7
          path: outputs/global_holdout
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
