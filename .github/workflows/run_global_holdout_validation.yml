name: Industry Boom Global Holdout V0.8.6

on:
  workflow_dispatch:
    inputs:
      refresh_sec_fsds:
        description: 'Ignore cached SEC quarterly data and rebuild the point-in-time seed'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -c "import ible, ible.sec_fsds_cli, ible.global_holdout_cli; print('IBLE_IMPORT_OK', ible.__version__)"
          python - <<'PY'
          import os
          from ible.collectors.sec_fsds import SecFsdsClient
          client = SecFsdsClient('.cache/sec_fsds', os.environ.get('SEC_USER_AGENT', ''))
          client.validate_user_agent()
          print('SEC_USER_AGENT_FORMAT_OK')
          PY
          python -m pytest -q
      - name: Restore SEC FSDS cache
        if: ${{ !inputs.refresh_sec_fsds }}
        uses: actions/cache@v5
        with:
          path: |
            .cache/sec_fsds/downloads
            validation_seed/sec_fsds_fy2021.json
          key: sec-fsds-v086-${{ hashFiles('config/global_holdouts.yml', 'config/theme_exposures.yml', 'config/sec_cik_map.json', 'src/ible/collectors/sec_fsds.py') }}
      - name: Build official SEC point-in-time seed
        run: |
          set -euo pipefail
          FORCE=''
          if [ "${{ inputs.refresh_sec_fsds }}" = 'true' ]; then FORCE='--force'; fi
          python -m ible.sec_fsds_cli --root . ${FORCE}
      - name: Run global holdout
        run: |
          set -euo pipefail
          rm -rf outputs/global_holdout
          python -m ible.global_holdout_cli --root . --output-dir outputs/global_holdout
      - name: Validate outputs
        run: |
          set -euo pipefail
          test -s outputs/global_holdout/global_holdout_summary.json
          test -s outputs/global_holdout/global_holdout_ranking.json
          python - <<'PY'
          import json
          p=json.load(open('outputs/global_holdout/global_holdout_summary.json',encoding='utf-8'))
          print(json.dumps({
            'status':p['status'],
            'financial_source':p['financial_source'],
            'dataset_gate_passed':p['dataset_gate_passed'],
            'metrics':p['metrics'],
            'financial_data':{
              'status':p['financial_data'].get('status'),
              'requested':p['financial_data'].get('requested'),
              'historically_eligible_count':p['financial_data'].get('historically_eligible_count'),
              'available':p['financial_data'].get('available'),
              'coverage':p['financial_data'].get('coverage_of_historically_eligible'),
            },
          },ensure_ascii=False,indent=2))
          assert p.get('investment_use_allowed') is False
          assert p.get('financial_source') == 'sec_financial_statement_data_sets'
          assert p.get('status') in {
            'PASSED_V086_GLOBAL_HOLDOUT',
            'FAILED_V086_GLOBAL_HOLDOUT',
            'INSUFFICIENT_V086_GLOBAL_HOLDOUT',
          }
          PY
      - name: Upload SEC FSDS diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-sec-fsds-diagnostics-v0.8.6
          path: .cache/sec_fsds/sec_fsds_status.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload compact SEC seed
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-sec-fsds-seed-v0.8.6
          path: validation_seed/sec_fsds_fy2021.json
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 9
      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-global-holdout-v0.8.6
          path: outputs/global_holdout
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
