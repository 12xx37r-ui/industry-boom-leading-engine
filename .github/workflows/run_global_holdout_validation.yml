name: Industry Boom Global Holdout V0.8.4

on:
  workflow_dispatch:
    inputs:
      refresh_financial_data:
        description: 'Ignore cached FMP statements and download again'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FINANCIAL_SOURCE: fmp
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: '1'
      FMP_QUARTER_LIMIT: '20'
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -c "import ible, ible.fmp_cli, ible.global_holdout_cli; print('IBLE_IMPORT_OK', ible.__version__)"
          test -n "${FMP_API_KEY:-}" || { echo 'FMP_API_KEY repository secret is required'; exit 1; }
          python - <<'PY'
          import os
          from ible.collectors.fmp import FmpClient
          FmpClient('.cache/fmp', os.environ['FMP_API_KEY']).validate_api_key()
          print('FMP_API_KEY_FORMAT_OK')
          PY
          python -m pytest -q
      - name: Restore FMP statement cache
        if: ${{ !inputs.refresh_financial_data }}
        uses: actions/cache@v5
        with:
          path: .cache/fmp/subset
          key: fmp-quarterly-v084-${{ hashFiles('config/global_holdouts.yml', 'config/theme_exposures.yml') }}
      - name: Prepare standardized quarterly statements
        run: |
          set -euo pipefail
          FORCE=''
          if [ "${{ inputs.refresh_financial_data }}" = 'true' ]; then FORCE='--force'; fi
          python -m ible.fmp_cli --root . ${FORCE}
      - name: Run global holdout
        run: |
          set -euo pipefail
          rm -rf outputs/global_holdout
          python -m ible.global_holdout_cli --root . --output-dir outputs/global_holdout
      - name: Validate outputs
        run: |
          set -euo pipefail
          test -s outputs/global_holdout/global_holdout_summary.json
          test -s outputs/global_holdout/global_holdout_ranking.json
          python - <<'PY'
          import json
          p=json.load(open('outputs/global_holdout/global_holdout_summary.json',encoding='utf-8'))
          print(json.dumps({
            'status':p['status'],
            'financial_source':p['financial_source'],
            'metrics':p['metrics'],
            'financial_data':p['financial_data'],
          },ensure_ascii=False,indent=2))
          assert p.get('investment_use_allowed') is False
          assert p.get('financial_source') == 'fmp'
          PY
      - name: Upload financial diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-financial-diagnostics-v0.8.4
          path: .cache/fmp/fmp_download_status.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: industry-boom-global-holdout-v0.8.4
          path: outputs/global_holdout
          retention-days: 30
          compression-level: 9
