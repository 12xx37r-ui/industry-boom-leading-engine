name: Industry Boom Validation Rescore

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: industry-boom-validation-rescore
  cancel-in-progress: true

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Resolve validation input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous_validation/backtests

          # V0.6.2 includes the already collected seven scenario files so this
          # workflow never depends on a GitHub artifact remaining available.
          if compgen -G "validation_seed/backtests/*.json" > /dev/null; then
            cp validation_seed/backtests/*.json previous_validation/backtests/
            echo "Using repository validation_seed"
          else
            echo "No local validation_seed; trying repository artifact fallback"
            API_PATH="/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"
            ARTIFACT_JSON=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_PATH")
            DOWNLOAD_URL=$(printf '%s' "$ARTIFACT_JSON" | python -c '
import json,sys
p=json.load(sys.stdin)
rows=[a for a in p.get("artifacts",[]) if not a.get("expired") and a.get("name")=="industry-boom-validation-output"]
rows.sort(key=lambda x:x.get("created_at", ""), reverse=True)
print(rows[0].get("archive_download_url", "") if rows else "")
')
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "No validation_seed and no readable industry-boom-validation-output artifact"
              exit 1
            fi
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$DOWNLOAD_URL" --output previous_validation.zip
            unzip -q previous_validation.zip -d previous_validation
          fi

          COUNT=$(find previous_validation/backtests -maxdepth 1 -name '*.json' | wc -l)
          if [ "$COUNT" -ne 7 ]; then
            echo "Expected 7 validation scenario files, got $COUNT"
            find previous_validation -maxdepth 3 -type f -print
            exit 1
          fi
          find previous_validation/backtests -maxdepth 1 -type f -print

      - name: Rescore without API recollection
        run: |
          rm -rf outputs/rescored_validation
          mkdir -p outputs/rescored_validation
          python -m ible.rescore_validation \
            --input-dir previous_validation/backtests \
            --output-dir outputs/rescored_validation

      - name: Validate rescored outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/rescored_validation")
          for name in ["walkforward_backtest.json", "backtest_summary.json", "model_validation.json"]:
              path = root / name
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"missing output: {path}")
              json.loads(path.read_text(encoding="utf-8"))
          files = list((root / "backtests").glob("*.json"))
          if len(files) != 7:
              raise SystemExit(f"expected 7 rescored scenarios, got {len(files)}")
          print("RESCORED_VALIDATION_OK")
          PY

      - name: Upload rescored validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: industry-boom-validation-rescored-v0.6.2
          path: |
            outputs/rescored_validation/backtests/*.json
            outputs/rescored_validation/walkforward_backtest.json
            outputs/rescored_validation/backtest_summary.json
            outputs/rescored_validation/model_validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit rescored validation summary
        run: |
          mkdir -p outputs
          cp outputs/rescored_validation/walkforward_backtest.json outputs/walkforward_backtest.json
          cp outputs/rescored_validation/backtest_summary.json outputs/backtest_summary.json
          cp outputs/rescored_validation/model_validation.json outputs/model_validation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/walkforward_backtest.json outputs/backtest_summary.json outputs/model_validation.json
          if git diff --cached --quiet; then
            echo "No rescored validation summary changes"
          else
            git commit -m "chore: rescore validation with repository seed v0.6.2"
            git push
          fi
