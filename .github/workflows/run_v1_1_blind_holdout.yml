name: Industry Boom V1.1 Blind Theme Holdout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test V1.1 release only
        run: python -m pytest -q -p no:cacheprovider tests/test_v1_1_release.py

      - name: Run sealed blind holdout
        run: |
          rm -rf outputs/v1_1_blind
          python -m ible.blind_holdout_cli --root . --output-dir outputs/v1_1_blind

      - name: Verify generated outputs
        run: |
          test -s outputs/v1_1_blind/v1_1_blind_holdout_summary.json
          test -s outputs/v1_1_blind/v1_1_blind_holdout_ranking.json
          test -s outputs/v1_1_blind/v1_1_blind_holdout_scenarios.json
          test -s outputs/v1_1_blind/v1_1_model_lock_verification.json
          test -s outputs/v1_1_blind/v1_1_next_gate.json
          python - <<'PY'
          import json
          with open('outputs/v1_1_blind/v1_1_blind_holdout_summary.json', encoding='utf-8') as f:
              d = json.load(f)
          assert d['status'] in {'V1_1_BLIND_THEME_HOLDOUT_PASSED', 'V1_1_BLIND_THEME_HOLDOUT_FAILED'}
          assert d['model_lock']['status'] == 'LOCK_VERIFIED'
          assert d['execution_mode'] == 'github_actions_only'
          assert d['network_collection_used'] is False
          assert d['bat_cmd_colab_used'] is False
          assert d['investment_use_allowed'] is False
          assert d['external_independence'] is False
          print(json.dumps({'status': d['status'], 'metrics': d['metrics']}, ensure_ascii=False, indent=2))
          PY

      - name: Upload V1.1 result
        uses: actions/upload-artifact@v4
        with:
          name: industry-boom-v1.1-blind-holdout-result
          path: outputs/v1_1_blind
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
