<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <style>
    :root{--bg:#f3f6fb;--panel:#fff;--ink:#132033;--muted:#66758a;--line:#dfe6ef;--blue:#2864dc;--navy:#163a70;--green:#11845b;--amber:#a76400;--red:#bd2c2c;--violet:#7050c7;--shadow:0 10px 28px rgba(28,45,73,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,"Noto Sans KR",sans-serif;font-size:14px}.shell{max-width:1500px;margin:auto;padding:22px}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.title{font-size:27px;font-weight:900;letter-spacing:-.8px}.subtitle{margin-top:7px;color:var(--muted);line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.btn:hover{border-color:#b8c6d9}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.statusline{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:#48586d;font-size:12px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.warning{background:#fff8e8;border:1px solid #edd39c;border-radius:12px;padding:12px 14px;color:#735015;margin-bottom:16px;line-height:1.55}.error{background:#fff0ef;border:1px solid #f0bbb7;color:#98251e;padding:16px;border-radius:12px;white-space:pre-wrap}.loading{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
    .kpis{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px;margin-bottom:18px}.kpi,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.kpi{padding:15px}.kpi .label{font-size:12px;color:var(--muted);font-weight:700}.kpi .value{font-size:27px;font-weight:900;margin:5px 0}.bar{height:7px;border-radius:999px;background:#e8edf5;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#65a2ff);border-radius:999px}.panel{padding:17px;margin-bottom:16px}.panel-title{font-size:18px;font-weight:900;margin:0 0 13px}.summary-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px}.alertbox{border:1px solid var(--line);border-radius:12px;padding:15px}.alertbox .big{font-size:30px;font-weight:900}.alertbox.champ{border-left:5px solid var(--blue)}.alertbox.chall{border-left:5px solid var(--violet)}.alertbox.added{border-left:5px solid var(--green)}.muted{color:var(--muted)}.small{font-size:12px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;white-space:nowrap}.b-champ{background:#e7f0ff;color:#2357b6}.b-chall{background:#eee8ff;color:#6545af}.b-added{background:#e5f7ef;color:#08734c}.b-watch{background:#fff0d3;color:#8a5800}.b-high{background:#e4f5eb;color:#08734c}.b-monitor{background:#edf0f4;color:#5c6877}.b-pass{background:#e5f7ef;color:#08734c}.b-fail{background:#ffe9e7;color:#a72822}
    .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.input,.select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink)}.input{min-width:240px;flex:1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;background:#fff;min-width:1030px}th,td{padding:10px 11px;border-bottom:1px solid #e8edf3;text-align:left;vertical-align:middle}th{font-size:12px;color:#5b6a7d;background:#f8fafc;position:sticky;top:0;z-index:1}td.num{text-align:right;font-variant-numeric:tabular-nums}.theme{font-weight:900}.sector{font-size:12px;color:var(--muted);margin-top:3px}.rank{font-size:18px;font-weight:900}.move{font-size:11px;font-weight:900}.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}.scorebar{min-width:120px}.scoreline{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}.scorebar .bar{height:6px}.scorebar.commercial .bar>i{background:linear-gradient(90deg,#13a071,#65d1a9)}.scorebar.investment .bar>i{background:linear-gradient(90deg,#7a55cf,#af98ea)}
    .validation{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric-card{border:1px solid var(--line);border-radius:12px;padding:14px}.metric-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.model{background:#f7f9fc;border-radius:10px;padding:11px}.model h4{margin:0 0 8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:17px;color:var(--ink);margin-top:2px}.horizons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.horizon{border:1px solid var(--line);border-radius:12px;padding:14px}.horizon h3{margin:0 0 9px}.due{font-size:13px;padding:10px;border-radius:10px;background:#f7f9fc}.foot{color:var(--muted);font-size:12px;line-height:1.6;padding:4px 0 18px}.hide{display:none!important}@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.summary-grid,.validation{grid-template-columns:1fr}.horizons{grid-template-columns:1fr}.header{flex-direction:column}.actions{width:100%}}@media(max-width:540px){.shell{padding:13px}.kpis{grid-template-columns:1fr 1fr}.title{font-size:23px}.btn{flex:1}.input{min-width:100%}}
  </style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div><div class="title">산업 붐 선행예측 대시보드</div><div class="subtitle">V6.2 · Champion–Challenger 월별 불변 예측 · 6·12·24개월 미래검증</div></div>
    <div class="actions"><button class="btn" id="diagnoseBtn">연결 진단</button><button class="btn primary" id="refreshBtn">최신 데이터 새로고침</button></div>
  </header>
  <div id="app"><div class="loading">GitHub 결과 JSON을 불러오는 중입니다…</div></div>
</main>
<script>
const state={data:null,query:'',sector:'ALL',alert:'ALL'};
const $=s=>document.querySelector(s);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v,d=1){const x=Number(v);return Number.isFinite(x)?x.toFixed(d):'-'}
function pct(v){const x=Number(v);return Number.isFinite(x)?(x*100).toFixed(1)+'%':'-'}
function stageBadge(stage){const s=String(stage||'');const cls=s.includes('HIGH')?'b-high':s.includes('WATCH')?'b-watch':'b-monitor';const label=s.includes('HIGH')?'고우선 후보':s.includes('WATCH')?'관찰 후보':'감시';return `<span class="badge ${cls}">${label}</span>`}
function boolBadge(v,label,cls){return v?`<span class="badge ${cls}">${label}</span>`:''}
function rankMove(r,available){if(!available)return '<span class="move flat">기준선</span>';if(r.is_new_entry)return '<span class="move up">NEW</span>';if(r.rank_change>0)return `<span class="move up">▲ ${r.rank_change}</span>`;if(r.rank_change<0)return `<span class="move down">▼ ${Math.abs(r.rank_change)}</span>`;return '<span class="move flat">―</span>'}
function progressCard(label,value){const x=Math.max(0,Math.min(100,Number(value)||0));return `<div class="kpi"><div class="label">${esc(label)}</div><div class="value">${num(x,0)}%</div><div class="bar"><i style="width:${x}%"></i></div></div>`}
function metricBlock(label,m){m=m||{};return `<div class="model"><h4>${esc(label)}</h4><div class="metrics"><div class="metric">성공산업 재현율<strong>${pct(m.positive_recall)}</strong></div><div class="metric">오경보율<strong>${pct(m.false_alarm_rate)}</strong></div><div class="metric">균형점수<strong>${pct(m.balanced_score)}</strong></div><div class="metric">경보 정밀도<strong>${pct(m.alert_precision)}</strong></div></div></div>`}
function scoreBar(label,value,kind=''){const x=Math.max(0,Math.min(100,Number(value)||0));return `<div class="scorebar ${kind}"><div class="scoreline"><span>${esc(label)}</span><b>${num(value)}</b></div><div class="bar"><i style="width:${x}%"></i></div></div>`}
function render(d){state.data=d;const p=d.progress||{},a=d.alerts||{},snap=d.snapshot||{},due=d.next_evaluation_due||{};const sectors=[...new Set((d.top_20||[]).map(x=>x.sector))].sort();
  const source=`${esc(d.source?.repository||'-')} · ${esc(d.source?.branch||'-')} · ${esc(d.source?.mode||'-')}`;
  $('#app').innerHTML=`
    <div class="statusline"><span class="chip"><i class="dot"></i>${esc(d.status)}</span><span class="chip">기준일 ${esc(d.as_of||'-')}</span><span class="chip">스냅샷 ${esc(snap.count||0)}개</span><span class="chip">${source}</span><span class="chip">불러온 시각 ${new Date(d.loaded_at).toLocaleString('ko-KR')}</span></div>
    <div class="warning">${(d.warnings||[]).map(esc).join(' · ')}</div>
    <section class="kpis">${progressCard('엔진 기능',p.software_build_percent)}${progressCard('데이터 파이프라인',p.data_pipeline_percent)}${progressCard('과거 검증',p.historical_validation_percent)}${progressCard('미래 독립검증',p.prospective_validation_percent)}${progressCard('전체 진행률',p.overall_estimate_percent)}</section>
    <section class="panel"><h2 class="panel-title">현재 경보 현황</h2><div class="summary-grid"><div class="alertbox champ"><div class="muted">Champion 경보</div><div class="big">${a.champion||0}</div><div class="small muted">동결된 기본 정책</div></div><div class="alertbox chall"><div class="muted">Challenger 경보</div><div class="big">${a.challenger||0}</div><div class="small muted">미래검증 전 Shadow 전용</div></div><div class="alertbox added"><div class="muted">Challenger 추가 탐지</div><div class="big">${a.added_count||0}</div><div class="small muted">${esc((a.added_theme_ids||[]).join(', ')||'없음')}</div></div></div><div class="due" style="margin-top:12px">다음 평가: <b>${esc(due.due_date||'대기')}</b> · ${esc(due.horizon_months||'-')}개월 · ${esc(due.snapshot_id||'-')} 스냅샷</div></section>
    <section class="panel"><h2 class="panel-title">산업 TOP20</h2><div class="toolbar"><input id="query" class="input" placeholder="산업명 또는 섹터 검색"><select id="sector" class="select"><option value="ALL">전체 섹터</option>${sectors.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="alert" class="select"><option value="ALL">전체 경보</option><option value="CHAMPION">Champion</option><option value="CHALLENGER">Challenger</option><option value="ADDED">Challenger 추가</option><option value="NONE">경보 없음</option></select></div><div class="table-wrap"><table><thead><tr><th>순위</th><th>산업</th><th>단계</th><th>예측점수</th><th>사업화</th><th>기업투자</th><th>확산</th><th>경보</th></tr></thead><tbody id="rankingBody"></tbody></table></div></section>
    <section class="panel"><h2 class="panel-title">과거 검증: Champion vs Challenger</h2><div class="validation"><div class="metric-card"><div class="metric-head"><b>역사 벤치마크</b>${d.validation?.historical?.champion_gate_passed?'<span class="badge b-pass">Champion 통과</span>':'<span class="badge b-fail">Champion 기준미달</span>'}</div><div class="compare">${metricBlock('Champion',d.validation?.historical?.champion)}${metricBlock('Challenger',d.validation?.historical?.challenger)}</div></div><div class="metric-card"><div class="metric-head"><b>봉인 블라인드</b>${d.validation?.blind?.champion_gate_passed?'<span class="badge b-pass">Champion 통과</span>':'<span class="badge b-fail">Champion 기준미달</span>'}</div><div class="compare">${metricBlock('Champion',d.validation?.blind?.champion)}${metricBlock('Challenger',d.validation?.blind?.challenger)}</div></div></div><div class="small muted" style="margin-top:10px">Challenger 연구 게이트: <b>${d.validation?.research_gate_passed?'통과':'미통과/미확인'}</b> · 변경 사례: ${esc((d.validation?.changed_cases||[]).join(', ')||'없음')}</div></section>
    <section class="panel"><h2 class="panel-title">미래 6·12·24개월 성적표</h2><div class="horizons">${[6,12,24].map(h=>horizonCard(h,d)).join('')}</div><div class="warning" style="margin:13px 0 0">자동 승격 가능: <b>${d.prospective?.automatic_promotion_allowed?'YES':'NO'}</b> · 승격 평가 가능: <b>${d.prospective?.promotion_evaluable?'YES':'NO'}</b> · 투자 사용 허용: <b>${d.prospective?.investment_use_allowed?'YES':'NO'}</b></div></section>
    <div class="foot">순위 변화는 월별 스냅샷이 2개 이상 쌓인 뒤 표시됩니다. 현재 스냅샷: ${esc(snap.current_id||'-')} · 이전 스냅샷: ${esc(snap.previous_id||'없음')}.</div>`;
  bindFilters();renderRows();
}
function horizonCard(h,d){const policy=d.prospective?.horizons?.[String(h)]||{},market=d.prospective?.market_outcomes?.[String(h)]||{},top=market.top_10||{};return `<div class="horizon"><h3>${h}개월</h3><div class="metric">정책 만기 스냅샷<strong>${policy.matured_snapshot_count||0}</strong></div><div class="metric">시장 관측수<strong>${market.theme_observation_count||0}</strong></div><div class="metrics" style="margin-top:9px"><div class="metric">TOP10 성공률<strong>${pct(top.top_success_rate)}</strong></div><div class="metric">순위상관<strong>${num(top.rank_correlation,2)}</strong></div><div class="metric">상·하위 격차<strong>${num(top.top_bottom_outcome_spread)}</strong></div><div class="metric">평가상태<strong>${policy.matured_snapshot_count?'진행':'대기'}</strong></div></div></div>`}
function bindFilters(){$('#query').addEventListener('input',e=>{state.query=e.target.value.trim().toLowerCase();renderRows()});$('#sector').addEventListener('change',e=>{state.sector=e.target.value;renderRows()});$('#alert').addEventListener('change',e=>{state.alert=e.target.value;renderRows()})}
function renderRows(){const d=state.data||{},rows=(d.top_20||[]).filter(r=>{const q=(r.theme_name+' '+r.theme_id+' '+r.sector).toLowerCase();if(state.query&&!q.includes(state.query))return false;if(state.sector!=='ALL'&&r.sector!==state.sector)return false;if(state.alert==='CHAMPION'&&!r.champion_live_alert)return false;if(state.alert==='CHALLENGER'&&!r.challenger_live_alert)return false;if(state.alert==='ADDED'&&!r.added_by_challenger)return false;if(state.alert==='NONE'&&(r.champion_live_alert||r.challenger_live_alert))return false;return true});$('#rankingBody').innerHTML=rows.map(r=>`<tr><td><div class="rank">${esc(r.rank)}</div>${rankMove(r,d.snapshot?.rank_change_available)}</td><td><div class="theme">${esc(r.theme_name)}</div><div class="sector">${esc(r.sector)}</div></td><td>${stageBadge(r.candidate_stage)}</td><td>${scoreBar('예측',r.predicted_score)}</td><td>${scoreBar('사업화',r.direct_commercialization_score,'commercial')}</td><td>${scoreBar('투자',r.phase3_investment_score,'investment')}</td><td class="num">${num(r.source_diffusion_percent,0)}%</td><td>${boolBadge(r.champion_live_alert,'Champion','b-champ')} ${boolBadge(r.challenger_live_alert,'Challenger','b-chall')} ${boolBadge(r.added_by_challenger,'추가','b-added')}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">조건에 맞는 산업이 없습니다.</td></tr>'}
function fail(err){const msg=err&&err.message?err.message:String(err);$('#app').innerHTML=`<div class="error"><b>대시보드 로드 실패</b>\n\n${esc(msg)}\n\nGAS 설정 → 스크립트 속성에서 공개 저장소는 GITHUB_OWNER, GITHUB_REPO, GITHUB_BRANCH를 등록하세요. 비공개 저장소는 GITHUB_TOKEN(Contents: Read)도 추가해야 합니다.</div>`}
function load(force){$('#refreshBtn').disabled=true;google.script.run.withSuccessHandler(d=>{$('#refreshBtn').disabled=false;render(d)}).withFailureHandler(e=>{$('#refreshBtn').disabled=false;fail(e)}).getDashboardData(force===true)}
$('#refreshBtn').addEventListener('click',()=>load(true));$('#diagnoseBtn').addEventListener('click',()=>{const b=$('#diagnoseBtn');b.disabled=true;b.textContent='진단 중…';google.script.run.withSuccessHandler(r=>{b.disabled=false;b.textContent='연결 진단';alert(`연결 정상\n저장소: ${r.repository}\n브랜치: ${r.branch}\n상태: ${r.payload_status}\n응답: ${r.elapsed_ms}ms`)}).withFailureHandler(e=>{b.disabled=false;b.textContent='연결 진단';alert(e.message||e)}).diagnoseDashboardConnection()});load(false);
</script>
</body>
</html>
