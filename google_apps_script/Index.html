<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #18202a;
      --muted: #687382;
      --line: #e2e7ed;
      --good: #137a4b;
      --warn: #a56b00;
      --bad: #b42318;
      --accent: #2457d6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .subtitle, .muted { color: var(--muted); }
    .status { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
    .pill { background: var(--card); border: 1px solid var(--line); padding: 9px 12px; border-radius: 999px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 3px 12px rgba(20,30,50,.04); }
    .topline { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .rank { font-size: 13px; font-weight: 700; color: var(--accent); }
    .name { margin: 4px 0 0; font-size: 19px; font-weight: 800; }
    .score { font-size: 29px; font-weight: 900; }
    .stage { display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 800; padding: 5px 8px; border-radius: 8px; background: #eef2ff; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .metric { padding: 9px; background: #f7f9fb; border-radius: 10px; text-align: center; }
    .metric b { display: block; font-size: 16px; margin-top: 4px; }
    ul { padding-left: 18px; margin: 10px 0 0; }
    li { margin: 5px 0; font-size: 13px; line-height: 1.4; }
    details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
    summary { cursor: pointer; font-weight: 700; font-size: 13px; }
    .error { background: #fff1f0; color: var(--bad); border: 1px solid #ffd2ce; padding: 14px; border-radius: 12px; }
    .section-title { margin: 28px 0 12px; font-size: 21px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; }
    th, td { border-bottom: 1px solid var(--line); padding: 11px; text-align: left; font-size: 13px; }
    th { background: #f8fafc; }
    .loader { padding: 40px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>산업 붐 선행예측</h1>
    <div class="subtitle">기술연구 확산 → 실집행 CAPEX → 초기 매출 → 상업화의 순서를 분리해, 붐 이전 자금축적 산업을 계산한 결과입니다.</div>
    <div id="app" class="loader">GitHub 결과를 불러오는 중입니다…</div>
  </main>

  <script>
    function n(value, digits) {
      const x = Number(value);
      return Number.isFinite(x) ? x.toFixed(digits == null ? 1 : digits) : '-';
    }

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function stageLabel(stage) {
      const labels = {
        EARLY_ACCUMULATION: '연구주도 초기축적', CAPITAL_LED_ACCUMULATION: '실물투자주도 초기축적', TRANSITION: '상업화 전환',
        COMMERCIAL_BOOM: '본격 상업화', PRE_BOOM: '붐 전단계',
        ACCUMULATION: '자금 축적', WATCH: '관찰',
        NO_SIGNAL: '신호 없음', INSUFFICIENT_DATA: '자료 부족'
      };
      return labels[stage] || stage;
    }

    function renderCard(row, index) {
      const reasons = (row.top_reasons || []).map(x => '<li>' + esc(x) + '</li>').join('');
      const invalidations = (row.invalidations || []).map(x => '<li>' + esc(x) + '</li>').join('');
      return `
        <article class="card">
          <div class="topline">
            <div><div class="rank">현재 ${index + 1}위</div><div class="name">${esc(row.theme_name)}</div></div>
            <div class="score">${n(row.boom_score, 1)}</div>
          </div>
          <span class="stage">${esc(stageLabel(row.stage))}</span>
          <div class="metrics">
            <div class="metric">선행점수<b>${n(row.early_signal_score, 1)}</b></div>
            <div class="metric">상업화<b>${n(row.commercial_realization_score, 1)}</b></div>
            <div class="metric">교차확인<b>${n(row.cross_confirmation_score, 1)}</b></div>
          </div>
          <div class="metrics">
            <div class="metric">6개월<b>${n(Number(row.boom_probability_6m) * 100, 0)}%</b></div>
            <div class="metric">12개월<b>${n(Number(row.boom_probability_12m) * 100, 0)}%</b></div>
            <div class="metric">신뢰도<b>${n(row.data_confidence, 0)}</b></div>
          </div>
          <strong>상위 근거</strong><ul>${reasons || '<li>근거 부족</li>'}</ul>
          <details><summary>금액·기술 신호</summary>
            <ul>
              <li>투자금액 점수: ${n(row.engines && row.engines.capital_amounts && row.engines.capital_amounts.score, 1)}</li>
              <li>계약금액 점수: ${n(row.engines && row.engines.contract_amounts && row.engines.contract_amounts.score, 1)}</li>
              <li>기술연구 확산: ${n(row.engines && row.engines.research_momentum && row.engines.research_momentum.score, 1)}</li>
              <li>실적 대중화 전 선행격차: ${n(row.transition_gap_score, 1)}</li>
              <li>금액 추출률: ${n(Number(row.coverage && row.coverage.amount_coverage) * 100, 0)}%</li>
            </ul>
          </details>
          <details><summary>판정 무효화 조건</summary><ul>${invalidations}</ul></details>
        </article>`;
    }

    function render(data) {
      const health = data.health || {};
      const ranking = Array.isArray(data.ranking) ? data.ranking : [];
      const replay = data.replay || {};
      const validation = data.validation || {};
      const backtest = data.backtest || {};
      const btMetrics = backtest.metrics || {};
      const sourceStatus = health.sources || {};
      const statusPills = Object.keys(sourceStatus).map(key => {
        const item = sourceStatus[key] || {};
        return `<span class="pill">${esc(key.toUpperCase())}: ${esc(item.status || '-')}</span>`;
      }).join('');

      const replayRows = ((replay.ranking || []).slice(0, 10)).map((row, index) => `
        <tr><td>${index + 1}</td><td>${esc(row.theme_name)}</td><td>${n(row.boom_score, 1)}</td><td>${esc(stageLabel(row.stage))}</td><td>${n(row.data_confidence, 0)}</td></tr>`).join('');

      const backtestSection = backtest.scenario_table ? `
        <h2 class="section-title">다중 산업 워크포워드 검증</h2>
        <div class="card"><table><thead><tr><th>시나리오</th><th>구분</th><th>결과</th><th>순위</th><th>점수</th><th>단계</th></tr></thead><tbody>
          ${backtest.scenario_table.map(row => `<tr><td>${esc(row.name || row.scenario_id)}</td><td>${esc(row.label)}</td><td>${esc(row.status)}</td><td>${esc(row.rank == null ? '-' : row.rank)}</td><td>${n(row.boom_score, 1)}</td><td>${esc(stageLabel(row.stage))}</td></tr>`).join('')}
        </tbody></table></div>` : '';

      document.getElementById('app').className = '';
      document.getElementById('app').innerHTML = `
        <div class="status">
          <span class="pill">기준일 ${esc(health.current_as_of || '-')}</span>
          <span class="pill">엔진 ${esc(health.engine_version || '-')}</span>
          <span class="pill">AI 재현순위 ${esc(replay.ai_theme_rank || '-')}위</span>
          <span class="pill">검증 ${esc(validation.status || '-')}</span>
          <span class="pill">투자사용 ${validation.investment_use_allowed ? '허용' : '금지'}</span>
          <span class="pill">성공 재현율 ${btMetrics.positive_recall == null ? '-' : n(Number(btMetrics.positive_recall) * 100, 0) + '%'}</span>
          <span class="pill">허위경보율 ${btMetrics.false_alarm_rate == null ? '-' : n(Number(btMetrics.false_alarm_rate) * 100, 0) + '%'}</span>
          ${statusPills}
        </div>
        <div class="grid">${ranking.map(renderCard).join('')}</div>
        ${backtestSection}
        <h2 class="section-title">2022-10-31 AI 붐 재현시험</h2>
        <div class="card"><div class="muted">${esc(replay.methodology_warning || '')}</div>
          <table><thead><tr><th>순위</th><th>산업</th><th>점수</th><th>단계</th><th>신뢰도</th></tr></thead><tbody>${replayRows}</tbody></table>
        </div>`;
    }

    function fail(error) {
      document.getElementById('app').className = 'error';
      document.getElementById('app').textContent = error && error.message ? error.message : String(error);
    }

    google.script.run.withSuccessHandler(render).withFailureHandler(fail).getDashboardData();
  </script>
</body>
</html>
