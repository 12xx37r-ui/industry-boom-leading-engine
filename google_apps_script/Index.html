<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{margin:0;background:#f4f6f9;color:#18202a;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}h1{margin:0}.sub{color:#687382;margin:6px 0 18px}.pills{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.pill,.card{background:#fff;border:1px solid #e2e7ed;border-radius:14px}.pill{padding:8px 11px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{padding:16px}.rank{font-size:12px;color:#2457d6;font-weight:700}.name{font-size:18px;font-weight:800;margin:4px 0}.score{font-size:28px;font-weight:900}.muted{color:#687382}.bar{height:12px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#2457d6}.error{padding:14px;background:#fff1f0;color:#b42318;border-radius:12px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #e2e7ed;font-size:13px;text-align:left}h2{margin-top:28px}
  </style>
</head>
<body><main class="wrap"><h1>산업 붐 선행예측 V2.1</h1><div class="sub">50개 산업 후보군 확장 · 자료가 없는 산업은 임의 점수 없이 대기</div><div id="app">불러오는 중…</div></main>
<script>
function e(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(d){const u=d.universe||{},c=d.current||{},b=d.backlog||{};const ranking=Array.isArray(c.ranking)?c.ranking:[];const cards=ranking.map(r=>`<div class="card"><div class="rank">${e(r.rank)}위</div><div class="name">${e(r.theme_name)}</div><div class="score">${Number(r.boom_score).toFixed(1)}</div><div class="muted">${e(r.stage||'자료 단계 미제공')}</div></div>`).join('');const rows=(b.themes||[]).slice(0,20).map(r=>`<tr><td>${e(r.data_build_priority)}</td><td>${e(r.theme_name)}</td><td>${e(r.sector)}</td><td>${e(r.status)}</td></tr>`).join('');document.getElementById('app').innerHTML=`<div class="pills"><span class="pill">전체 ${e(u.theme_count)}개</span><span class="pill">점수 산출 ${e(u.scored_theme_count)}개</span><span class="pill">자료 대기 ${e(u.pending_theme_count)}개</span><span class="pill">커버리지 ${e(u.score_coverage_percent)}%</span><span class="pill">임의 점수 ${e(u.fabricated_score_count)}개</span></div><div class="card"><b>산업 데이터 커버리지</b><div class="bar"><div class="fill" style="width:${Number(u.score_coverage_percent||0)}%"></div></div></div><h2>현재 동결 점수 산업</h2><div class="grid">${cards}</div><h2>우선 구축 대상 20개</h2><table><thead><tr><th>우선순위</th><th>산업</th><th>분야</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table>`}
function fail(x){document.getElementById('app').className='error';document.getElementById('app').textContent=x&&x.message?x.message:String(x)}
google.script.run.withSuccessHandler(render).withFailureHandler(fail).getDashboardData();
</script></body></html>
