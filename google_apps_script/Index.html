<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{margin:0;background:#f4f6f9;color:#18202a;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}h1{margin:0}.sub{color:#687382;margin:6px 0 18px}.pills{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.pill,.card{background:#fff;border:1px solid #e2e7ed;border-radius:14px}.pill{padding:8px 11px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{padding:16px}.rank{font-size:12px;color:#2457d6;font-weight:700}.name{font-size:18px;font-weight:800;margin:4px 0}.score{font-size:28px;font-weight:900}.muted{color:#687382}.warn{padding:12px;background:#fff8e6;border-radius:10px;color:#7a5200}.error{padding:14px;background:#fff1f0;color:#b42318;border-radius:12px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #e2e7ed;font-size:13px;text-align:left}h2{margin-top:28px}
  </style>
</head>
<body><main class="wrap"><h1>산업 붐 선행예측 V5</h1><div class="sub">50개 산업 · 월별 불변 예측 · 6·12·24개월 자동 성과검증</div><div id="app">불러오는 중…</div></main>
<script>
function e(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function n(v){const x=Number(v);return Number.isFinite(x)?x.toFixed(1):'-'}
function render(d){const p=d.progress||{},ranking=Array.isArray(d.ranking)?d.ranking:[];const cards=ranking.slice(0,12).map(r=>`<div class="card"><div class="rank">${e(r.rank)}위 · ${e(r.candidate_stage)}</div><div class="name">${e(r.theme_name)}</div><div class="score">${n(r.prevalidation_candidate_score)}</div><div class="muted">사업화 ${n(r.direct_commercialization_score)} · ${e(r.mapping_quality)}</div></div>`).join('');const due=p.next_evaluation_due||{};document.getElementById('app').innerHTML=`<div class="pills"><span class="pill">엔진 ${e(p.engine_build_percent)}%</span><span class="pill">전체 ${e(p.total_project_percent)}%</span><span class="pill">월별 스냅샷 ${e(p.snapshot_count)}개</span><span class="pill">만기평가 ${e(p.matured_evaluation_count)}개</span><span class="pill">투자허용 ${d.investment_use_allowed?'YES':'NO'}</span></div><div class="warn">현재 순위는 사전검증 후보순위입니다. 다음 평가 예정: ${e(due.due_date||'대기')} (${e(due.horizon_months||'-')}개월)</div><h2>현재 후보 순위</h2><div class="grid">${cards}</div>`}
function fail(x){document.getElementById('app').className='error';document.getElementById('app').textContent=x&&x.message?x.message:String(x)}
google.script.run.withSuccessHandler(render).withFailureHandler(fail).getDashboardData();
</script></body></html>
