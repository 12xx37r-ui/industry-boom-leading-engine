[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-boom-leading-engine"
version = "0.5.0"
description = "Point-in-time industry boom leading indicator engine"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.3,<3",
  "PyYAML>=6.0.2,<7",
  "beautifulsoup4>=4.12,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
